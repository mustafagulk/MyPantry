<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#16a34a"/>
  <meta name="description" content="Track your family groceries and pantry stock"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="MyPantry"/>

  <!-- Icons — paths relative to /mypantry/ base -->
  <link rel="icon" type="image/png" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png"/>
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png"/>
  <link rel="manifest" href="manifest.json"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <title>MyPantry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #f0fdf4; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #86efac; border-radius: 4px; }
    input[type=number]::-webkit-inner-spin-button { opacity: 1; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
      signOut, onAuthStateChanged, updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, collection, doc, addDoc, setDoc, getDoc, getDocs,
      updateDoc, deleteDoc, onSnapshot, arrayUnion, arrayRemove,
      query, where, serverTimestamp, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ─────────────────────────────────────────────────────────
    //  🔧 PASTE YOUR FIREBASE CONFIG HERE
    // ─────────────────────────────────────────────────────────
    const firebaseConfig = {
      apiKey:            "YOUR_API_KEY",
      authDomain:        "YOUR_PROJECT.firebaseapp.com",
      projectId:         "YOUR_PROJECT_ID",
      storageBucket:     "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId:             "YOUR_APP_ID"
    };
    // ─────────────────────────────────────────────────────────

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    window.firebaseRefs      = { auth, db };
    window.firebaseAuth      = { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile };
    window.firebaseFirestore = { collection, doc, addDoc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, arrayUnion, arrayRemove, query, where, serverTimestamp, orderBy };

    const script = document.createElement("script");
    script.src = "./MyPantry.js";
    document.body.appendChild(script);
  </script>

  <!-- Service Worker + Notification Permission -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          // Unregister any old service workers first so cache is cleared
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            const isOld = reg.active && !reg.active.scriptURL.includes("service-worker.js");
            // Only unregister if it's a genuinely different SW (different scope)
          }

          const reg = await navigator.serviceWorker.register("service-worker.js", { scope: "./" });
          console.log("SW registered:", reg.scope);

          // Store SW registration globally so the app can send alert messages
          window.swRegistration = reg;

          // Request notification permission
          if ("Notification" in window && Notification.permission === "default") {
            const permission = await Notification.requestPermission();
            console.log("Notification permission:", permission);
          }

          window.notificationsEnabled =
            "Notification" in window && Notification.permission === "granted";

        } catch (err) {
          console.error("SW registration failed:", err);
        }
      });
    }

    // Helper function the app calls to trigger local notifications
    window.sendAlertNotifications = function(expiring, lowStock) {
      if (!window.notificationsEnabled) return;
      if (!navigator.serviceWorker.controller) return;
      navigator.serviceWorker.controller.postMessage({
        type: "SCHEDULE_ALERTS",
        expiring,
        lowStock
      });
    };
  </script>
</body>
</html>
